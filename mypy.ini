# mypy config for DocuMind.
#
# The backend uses `backend/` as its import root (e.g. `from config import ...`),
# so editors/CI that run mypy from the repo root must be told where that root is.
# Third-party packages without type stubs (celery, jose, passlib, aiofiles,
# bs4, fitz, cohere, …) are not type-checked.
[mypy]
mypy_path = backend
explicit_package_bases = True
namespace_packages = True
ignore_missing_imports = True
exclude = (^frontend/|/node_modules/|^build/|^dist/)
# Application code, not a typed library — keep it pragmatic, not pedantic.
check_untyped_defs = False
warn_unused_ignores = False
