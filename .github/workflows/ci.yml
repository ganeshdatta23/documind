name: CI

# Lean CI matched to the real stack. Deployment is handled automatically by
# Render (backend) and Vercel (frontend) on push to main — not from here.
# Gates that must pass: backend type-check (mypy), frontend type-check (tsc),
# and the backend Docker image build. Linters (ruff/eslint) run but are advisory
# so pre-existing style debt doesn't block the pipeline.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (type-check + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install tools
        run: pip install ruff mypy
      - name: Mypy (type check)
        run: mypy . --ignore-missing-imports --exclude alembic
      - name: Ruff (lint — advisory)
        run: ruff check .
        continue-on-error: true

  frontend:
    name: Frontend (type-check + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript type check
        run: npx tsc --noEmit
      - name: ESLint (advisory)
        run: npm run lint
        continue-on-error: true

  docker-build:
    name: Docker build (backend image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          push: false
          tags: documind-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
